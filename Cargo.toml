[package]
name = "herdr-revive"
version = "0.1.2"
edition = "2024"
rust-version = "1.97.1"
authors = ["Su Kang Yin <paradyse@gmail.com>"]
license = "MIT"
description = "Explicit, session-scoped command restoration for Herdr"
repository = "https://github.com/cantona/herdr-revive"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
fs2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.27"
toml = "0.8"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["socket", "poll", "fs", "user", "signal"] }

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.29", features = ["event"] }

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "deny"
